<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Booking test — Fresh Smiles Dental</title>
<style>
  body { font-family: system-ui, sans-serif; background: #167567; color: #222; text-align: center; padding: 60px 16px; }
  button.book { background: #D9A441; color: #3A2A08; border: none; border-radius: 12px; font: 700 17px system-ui, sans-serif; padding: 16px 30px; cursor: pointer; }
  #status { margin-top: 24px; font-size: 14px; }
</style>
<script src="https://schedule.jarvisanalytics.com/js/init.min.js"></script>
<script>
var jarvis = new JarvisAnalyticsScheduler({
  token: "812039|I6rPJNEgor8ZSXXE7YYySiTL3gSicLRN1MOHluVbb8e6a076",
  locationId: "2721795401517309",
  companyId: "2160",
  title: "Book your appointment",
  showLogo: 1,
  showPhoneNumber: true,
  showAddress: true,
  modalMode: true,
  colors: {
    primaryButtonBackground: "#D9A441",
    headerBackground: "#FFFFFF",
    bodyBackground: "#F6F8F6"
  }
});
</script>
</head>
<body>
<h1>Booking test page</h1>
<p>Click the button, then look at the first screen of the form.</p>
<button type="button" class="book" onclick="jarvis.toggle()">Book an Appointment</button>
<div id="status">Waiting for the form to open…</div>

<script>
(function () {
  var hiddenCount = 0;

  function eachNode(root, fn) {
    var nodes = root.querySelectorAll('*');
    for (var i = 0; i < nodes.length; i++) {
      fn(nodes[i]);
      if (nodes[i].shadowRoot) eachNode(nodes[i].shadowRoot, fn);
    }
  }

  function ownText(el) {
    var t = '';
    for (var i = 0; i < el.childNodes.length; i++) {
      if (el.childNodes[i].nodeType === 3) t += el.childNodes[i].nodeValue;
    }
    return t.replace(/\s+/g, ' ').trim();
  }

  function radios(el) { return el.querySelectorAll('input[type=radio]').length; }

  function hideOption(el) {
    var p = el, n = 0;
    while (p && radios(p) === 0 && n < 4) { p = p.parentElement; n++; }
    if (!p || radios(p) === 0) return false;
    while (p.parentElement && p.parentElement !== document.body && radios(p.parentElement) <= 1) {
      p = p.parentElement;
    }
    p.style.display = 'none';
    p.dataset.hiddenByFs = '1';
    return true;
  }

  function sweep() {
    eachNode(document, function (el) {
      if (el.dataset && el.dataset.fsDone) return;
      var t = ownText(el);
      if (t === 'Myself' || t === 'Someone Else') {
        el.dataset.fsDone = '1';
        if (hideOption(el)) hiddenCount++;
      }
    });
  }

  setInterval(function () {
    var s = document.getElementById('status');
    sweep();
    if (hiddenCount > 0) s.textContent = 'OK: hid ' + hiddenCount + ' option(s) (Myself / Someone Else).';
    else if (document.body.innerText.indexOf('Select one') > -1) s.textContent = 'Form is open but Myself / Someone Else was not found.';
  }, 300);
})();
</script>
</body>
</html>
