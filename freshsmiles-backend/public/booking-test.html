<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Booking test — Fresh Smiles Dental</title>
<style>
  body { font-family: system-ui, sans-serif; background: #167567; color: #222; text-align: center; padding: 60px 16px; }
  button.book { background: #D9A441; color: #3A2A08; border: none; border-radius: 12px; font: 700 17px system-ui, sans-serif; padding: 16px 30px; cursor: pointer; }
  #status { margin-top: 24px; font-size: 14px; }
  [data-fs-hide] { display: none !important; }
</style>
<script src="https://schedule.jarvisanalytics.com/js/init.min.js"></script>
<script>
var jarvis = new JarvisAnalyticsScheduler({
  token: "812039|I6rPJNEgor8ZSXXE7YYySiTL3gSicLRN1MOHluVbb8e6a076",
  locationId: "2721795401517309",
  companyId: "2160",
  title: "Book your appointment",
  showLogo: 1,
  showPhoneNumber: true,
  showAddress: true,
  modalMode: true,
  colors: {
    primaryButtonBackground: "#D9A441",
    headerBackground: "#FFFFFF",
    bodyBackground: "#F6F8F6"
  }
});
</script>
</head>
<body>
<h1>Booking test page</h1>
<p>Click the button, then look at the first screen of the form.</p>
<button type="button" class="book" onclick="jarvis.toggle()">Book an Appointment</button>
<div id="status">Waiting for the form to open…</div>

<script>
(function () {
  var TARGETS = ['Myself', 'Someone Else', 'Booking for'];

  function norm(s) { return (s || '').replace(/[\s\u00a0]+/g, ' ').trim(); }

  function eachNode(root, fn) {
    var nodes = root.querySelectorAll('*');
    for (var i = 0; i < nodes.length; i++) {
      fn(nodes[i]);
      if (nodes[i].shadowRoot) eachNode(nodes[i].shadowRoot, fn);
    }
  }

  function isRadioOnly(el) {
    if (!el) return false;
    if (el.matches && el.matches('input[type=radio]')) return true;
    return norm(el.textContent) === '' && el.querySelectorAll('input[type=radio]').length > 0;
  }

  function hide(el) {
    el.setAttribute('data-fs-hide', '1');
    el.style.setProperty('display', 'none', 'important');
  }

  function chain(el) {
    var parts = [], p = el;
    for (var i = 0; i < 3 && p; i++) { parts.push(p.tagName); p = p.parentElement; }
    return parts.join('>');
  }

  var lastChain = '';

  function sweep() {
    var count = 0;
    eachNode(document, function (el) {
      if (el.closest && el.closest('#status')) return;
      var tc = norm(el.textContent);
      if (TARGETS.indexOf(tc) === -1) return;
      var parent = el.parentElement;
      if (parent && norm(parent.textContent) === tc) return; // not the top-most block
      hide(el);
      if (isRadioOnly(el.previousElementSibling)) hide(el.previousElementSibling);
      if (isRadioOnly(el.nextElementSibling)) hide(el.nextElementSibling);
      lastChain = tc + ' = ' + chain(el);
      count++;
    });
    return count;
  }

  setInterval(function () {
    var s = document.getElementById('status');
    var c = sweep();
    if (c > 0) s.textContent = 'OK: hiding ' + c + ' item(s). Last: ' + lastChain;
    else if (document.body.innerText.indexOf('Select one') > -1) s.textContent = 'Form is open but nothing to hide was found.';
  }, 250);
})();
</script>
</body>
</html>
