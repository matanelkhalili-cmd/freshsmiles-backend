<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Booking test — Fresh Smiles Dental</title>
<style>
  body { font-family: system-ui, sans-serif; background: #167567; color: #222; text-align: center; padding: 60px 16px; }
  button.book { background: #D9A441; color: #3A2A08; border: none; border-radius: 12px; font: 700 17px system-ui, sans-serif; padding: 16px 30px; cursor: pointer; }
  #status { position: fixed; left: 8px; bottom: 8px; z-index: 2147483647; background: #fff; color: #000; border: 2px solid #c00; padding: 6px 8px; font: 11px/1.3 monospace; text-align: left; max-width: 90vw; white-space: pre-wrap; }
  [data-fs-hide] { display: none !important; }
</style>
<script src="https://schedule.jarvisanalytics.com/js/init.min.js"></script>
<script>
var jarvis = new JarvisAnalyticsScheduler({
  token: "812039|I6rPJNEgor8ZSXXE7YYySiTL3gSicLRN1MOHluVbb8e6a076",
  locationId: "2721795401517309",
  companyId: "2160",
  title: "Book your appointment",
  showLogo: 1,
  showPhoneNumber: true,
  showAddress: true,
  modalMode: true,
  colors: {
    primaryButtonBackground: "#D9A441",
    headerBackground: "#FFFFFF",
    bodyBackground: "#F6F8F6"
  }
});
</script>
</head>
<body>
<h1>Booking test page</h1>
<p>Click the button, then look at the first screen of the form.</p>
<button type="button" class="book" onclick="jarvis.toggle()">Book an Appointment</button>
<div id="status">v5 loaded. Waiting for the form…</div>

<script>
(function () {
  var TARGETS = ['myself', 'someone else', 'booking for'];

  function norm(s) { return (s || '').replace(/[\s\u00a0]+/g, ' ').trim().toLowerCase(); }

  function eachNode(root, fn) {
    var nodes = root.querySelectorAll('*');
    for (var i = 0; i < nodes.length; i++) {
      fn(nodes[i]);
      if (nodes[i].shadowRoot) eachNode(nodes[i].shadowRoot, fn);
    }
  }

  function hide(el) {
    el.setAttribute('data-fs-hide', '1');
    el.style.setProperty('display', 'none', 'important');
  }

  function topBlock(el, tc) {
    var p = el;
    while (p.parentElement && norm(p.parentElement.textContent) === tc) p = p.parentElement;
    return p;
  }

  function sweep() {
    var hidden = 0, report = [];
    try {
      // 1) by text
      eachNode(document, function (el) {
        if (el.closest && el.closest('#status')) return;
        var tc = norm(el.textContent);
        if (TARGETS.indexOf(tc) === -1) return;
        var top = topBlock(el, tc);
        hide(top);
        var prev = top.previousElementSibling, next = top.nextElementSibling;
        [prev, next].forEach(function (s) {
          if (s && norm(s.textContent) === '' && (s.matches('input[type=radio]') || s.querySelector('input[type=radio]'))) hide(s);
        });
        hidden++;
      });
      // 2) by radio button: climb from each circle to the block that holds only its label
      var all = [];
      eachNode(document, function (el) { if (el.matches && el.matches('input[type=radio]')) all.push(el); });
      all.forEach(function (r) {
        var p = r, tc = '', n = 0;
        while (p && n < 6) {
          tc = norm(p.textContent);
          if (tc !== '') break;
          p = p.parentElement; n++;
        }
        var info = (tc || '(no text)') + ' | val=' + (r.value || '') + ' id=' + (r.id || '') + ' name=' + (r.name || '') + (r.checked ? ' CHECKED' : '');
        if (p && TARGETS.indexOf(tc) > -1) {
          hide(topBlock(p, tc));
          var q = r;
          while (q.parentElement && norm(q.parentElement.textContent) === tc) q = q.parentElement;
          hide(q);
          info += ' -> hidden';
          hidden++;
        }
        report.push(info);
      });
    } catch (e) { report.push('ERROR: ' + e.message); }
    return { hidden: hidden, report: report };
  }

  setInterval(function () {
    var s = document.getElementById('status');
    var r = sweep();
    if (r.report.length || r.hidden) s.textContent = 'v5 | hid ' + r.hidden + '\n' + r.report.join('\n');
  }, 300);
})();
</script>
</body>
</html>
